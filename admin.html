<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עובד לי — ניהול</title><style>:root{--navy:#102a68;--bg:#f5f8fd;--text:#15213b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900}a,button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#fff;color:var(--navy)}main{max-width:1100px;margin:30px auto;padding:0 20px}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:14px;border-radius:12px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:20px}.stat b{font-size:30px;color:var(--navy);display:block}.panel{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e8edf5;text-align:right}.danger{background:#b42318;color:#fff}.approve{background:#188038;color:#fff}.reject{background:#b42318;color:#fff}.pending{color:#8a6700;font-weight:700}.approved{color:#167433;font-weight:700}.rejected{color:#a1261d;font-weight:700}.empty{color:#68748a}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}}</style><script>if(sessionStorage.getItem('ovedli_admin_session')!=='1'){location.replace('oved_li.html')}</script></head><body><header><div class="logo">עובד לי — מנהל</div><a class="back" href="oved_li.html">חזרה לאתר</a></header><main><div class="notice"><b>אישור נרשמים חדשים:</b> כל מחפש/ת עבודה או מעסיק/ה חדש/ה ממתינים לאישור כאן לפני שיוכלו להתחבר.</div><div class="stats"><div class="stat"><b id="uCount">0</b>משתמשים</div><div class="stat"><b id="pendingCount">0</b>ממתינים לאישור</div><div class="stat"><b id="pCount">0</b>פרופילים</div><div class="stat"><b id="jCount">0</b>משרות</div><div class="stat"><b id="aCount">0</b>מועמדויות</div></div><div class="panel"><h2>משתמשים והרשמות</h2><div class="tablewrap"><table><thead><tr><th>שם</th><th>אימייל</th><th>סוג</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="panel"><h2>משרות</h2><div class="tablewrap"><table><thead><tr><th>משרה</th><th>אזור</th><th>סוג</th><th></th></tr></thead><tbody id="jobs"></tbody></table></div></div><div class="panel"><h2>מועמדויות</h2><div class="tablewrap"><table><thead><tr><th>מועמד</th><th>משרה</th><th>טלפון</th><th>אימייל</th><th></th></tr></thead><tbody id="apps"></tbody></table></div></div></main><script>function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statusText(s){if(s==='pending')return'<span class="pending">ממתין לאישור</span>';if(s==='rejected')return'<span class="rejected">נדחה</span>';return'<span class="approved">מאושר</span>'}function approveUser(i){let u=get('ovedli_users');if(!u[i])return;u[i].status='approved';u[i].approvedAt=new Date().toISOString();set('ovedli_users',u);render()}function rejectUser(i){let u=get('ovedli_users');if(!u[i])return;if(!confirm('לדחות את ההרשמה הזו?'))return;u[i].status='rejected';u[i].rejectedAt=new Date().toISOString();set('ovedli_users',u);render()}function del(k,i){if(!confirm('למחוק פריט זה?'))return;let x=get(k);x.splice(i,1);set(k,x);render()}function rows(id,data,fn,empty){document.getElementById(id).innerHTML=data.length?data.map(fn).join(''):'<tr><td colspan="5" class="empty">'+empty+'</td></tr>'}function render(){let u=get('ovedli_users'),p=get('ovedli_profiles'),j=get('ovedli_jobs'),a=get('ovedli_applications');uCount.textContent=u.length;pendingCount.textContent=u.filter(x=>(x.status||'approved')==='pending').length;pCount.textContent=p.length;jCount.textContent=j.length;aCount.textContent=a.length;rows('users',u,(x,i)=>{let s=x.status||'approved';let buttons=s==='pending'?'<button class="approve" onclick="approveUser('+i+')">אישור</button><button class="reject" onclick="rejectUser('+i+')">דחייה</button>':s==='rejected'?'<button class="approve" onclick="approveUser('+i+')">אישור מחדש</button>':'<button class="reject" onclick="rejectUser('+i+')">חסימה</button>';return'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td>'+statusText(s)+'</td><td><div class="actions">'+buttons+'<button class="danger" onclick="del(\'ovedli_users\','+i+')">מחיקה</button></div></td></tr>'},'אין משתמשים');rows('jobs',j,(x,i)=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.area)+'</td><td>'+esc(x.type)+'</td><td><button class="danger" onclick="del(\'ovedli_jobs\','+i+')">מחיקה</button></td></tr>','אין משרות');rows('apps',a,(x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.job&&x.job.title)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td><button class="danger" onclick="del(\'ovedli_applications\','+i+')">מחיקה</button></td></tr>','אין מועמדויות')}render()</script></body></html>
