<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עובד לי — ניהול</title><style>:root{--navy:#102a68;--green:#18a63a;--bg:#f5f8fd;--text:#15213b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900}.logo span{color:#38d35d}a,button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#fff;color:var(--navy)}main{max-width:1100px;margin:30px auto;padding:0 20px}.notice{background:#fff3cd;border:1px solid #ffe69c;padding:14px;border-radius:12px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:20px}.stat b{font-size:30px;color:var(--navy);display:block}.panel{margin-top:18px}.panel h2{color:var(--navy)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e8edf5;text-align:right}.danger{background:#b42318;color:#fff}.empty{color:#68748a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.primary{background:var(--navy);color:#fff}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}} </style></head><body><header><div class="logo">עובד <span>לי</span> — מנהל</div><a class="back" href="oved_li.html">חזרה לאתר</a></header><main><div class="notice"><b>מצב הדגמה:</b> לוח הניהול מציג רק מידע שנשמר בדפדפן הזה. אין כאן עדיין אימות מנהל מאובטח או מסד נתונים מרכזי.</div><div class="stats"><div class="stat"><b id="uCount">0</b>משתמשים</div><div class="stat"><b id="pCount">0</b>פרופילים</div><div class="stat"><b id="jCount">0</b>משרות שפורסמו</div><div class="stat"><b id="aCount">0</b>מועמדויות</div></div><div class="panel"><h2>משתמשים</h2><div class="tablewrap"><table><thead><tr><th>שם</th><th>אימייל</th><th>סוג</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div><div class="panel"><h2>משרות</h2><div class="tablewrap"><table><thead><tr><th>משרה</th><th>אזור</th><th>סוג</th><th></th></tr></thead><tbody id="jobs"></tbody></table></div></div><div class="panel"><h2>מועמדויות</h2><div class="tablewrap"><table><thead><tr><th>מועמד</th><th>משרה</th><th>טלפון</th><th>אימייל</th><th></th></tr></thead><tbody id="apps"></tbody></table></div></div></main><script>function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function del(k,i){if(!confirm('למחוק פריט זה?'))return;let x=get(k);x.splice(i,1);set(k,x);render()}function rows(id,data,fn,empty){document.getElementById(id).innerHTML=data.length?data.map(fn).join(''):'<tr><td colspan="5" class="empty">'+empty+'</td></tr>'}function render(){let u=get('ovedli_users'),p=get('ovedli_profiles'),j=get('ovedli_jobs'),a=get('ovedli_applications');uCount.textContent=u.length;pCount.textContent=p.length;jCount.textContent=j.length;aCount.textContent=a.length;rows('users',u,(x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td><button class="danger" onclick="del(\'ovedli_users\','+i+')">מחיקה</button></td></tr>','אין משתמשים רשומים');rows('jobs',j,(x,i)=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.area)+'</td><td>'+esc(x.type)+'</td><td><button class="danger" onclick="del(\'ovedli_jobs\','+i+')">מחיקה</button></td></tr>','אין משרות שפורסמו');rows('apps',a,(x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.job&&x.job.title)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td><button class="danger" onclick="del(\'ovedli_applications\','+i+')">מחיקה</button></td></tr>','אין מועמדויות')}render()</script></body></html>
